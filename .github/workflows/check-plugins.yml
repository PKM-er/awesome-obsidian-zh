name: Check New Chinese Plugins

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scan for new Chinese plugins
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/check_plugins.py

      - name: Create PR for high-confidence plugins
        if: steps.scan.outputs.high_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADD_ROWS: ${{ steps.scan.outputs.add_rows }}
        run: python .github/scripts/check_plugins.py --apply

      - name: Create issue for review candidates
        if: steps.scan.outputs.medium_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIUM: ${{ steps.scan.outputs.medium_candidates }}
        run: python .github/scripts/check_plugins.py --issue
