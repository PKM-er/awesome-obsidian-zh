name: Check New Chinese Plugins

on:
  schedule:
    - cron: "17 0 */2 * *"
  workflow_dispatch:

concurrency:
  group: plugin-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Direct pushes to main are the only write this pipeline performs; PR
    # creation was removed, so the token needs no other scope. actions:write
    # lets the trailing prune step retire superseded workflow runs;
    # issues:write lets the trailing steps file/auto-close failure tickets.
    permissions:
      contents: write
      actions: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan new plugins
        id: scan
        # Use the workflow's own GITHUB_TOKEN, not the long-lived GH_PAT secret.
        # GH_PAT expired and every API call 401'd for a month while the run
        # still reported success; the auto-built token cannot expire. The script
        # now aborts on a rejected token, so a failure here is loud either way.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HTTP_TIMEOUT: 30
          STALE_HTTP_TIMEOUT: 10
        run: python .github/scripts/check_plugins.py

      - name: Commit cache-only update
        # Cache changes without README changes are committed straight to the
        # default branch so future runs stay incremental and create no PR noise.
        if: steps.scan.outputs.cache_changed == 'true' && steps.scan.outputs.content_changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add .github/scripts/checked_plugins.json
          git commit -m "chore: update checked plugin cache [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Apply changes to README
        id: apply
        # Only new rows now. Dormant plugins are marked in place by the
        # freshness step below and are never removed from the README.
        if: steps.scan.outputs.content_changed == 'true'
        env:
          ADD_ROWS: ${{ steps.scan.outputs.add_rows }}
        run: python .github/scripts/check_plugins.py --apply-readme

      - name: Validate README before commit
        if: steps.scan.outputs.content_changed == 'true'
        run: python .github/scripts/check_plugins.py --validate

      - name: Commit README changes directly
        # Single-maintainer repo: scan results (auto- and review-tier alike) are
        # committed straight to the default branch. No PR is opened, so there is
        # nothing left for the maintainer to merge or close each week.
        if: steps.scan.outputs.content_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add README.md
          if git diff --cached --quiet; then
            # Scan said content changed but apply landed as a no-op (e.g. a
            # candidate dropped late). Skip instead of crashing on an empty
            # commit; leftover cache files are swept by the freshness step.
            echo "no README changes to commit"
          else
            git commit -m "${{ steps.apply.outputs.pr_title }} [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Refresh freshness markers
        # Mark archived / long-dormant plugins from live repo metadata. Runs
        # every scheduled scan; results are cached 7 days so it stays well
        # under the GITHUB_TOKEN rate limit. Idempotent: markers self-correct
        # when a repo becomes active again, and theme rows are left untouched.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HTTP_TIMEOUT: 30
        run: python .github/scripts/check_plugins.py --freshness-readme

      - name: Validate README after freshness refresh
        # Freshness markers (and the new per-row '最后更新' badge) rewrite the
        # README; validate the table structure before committing so a bad render
        # can never be pushed to main.
        run: python .github/scripts/check_plugins.py --validate

      - name: Commit README + freshness cache
        # Capture marker updates (and the rolling freshness cache) in the same
        # branch. Skips the commit when nothing actually changed, so routine
        # scans stay quiet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add README.md .github/scripts/freshness_cache.json .github/scripts/checked_plugins.json
          if git diff --cached --quiet; then
            echo "no freshness/cache changes to commit"
          else
            git commit -m "chore: refresh archived/dormant plugin markers [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Close failure ticket on success
        # The prune step deletes failed runs at the next successful scan, so a
        # tracking issue is the only durable record of a failure. Close it here.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "插件扫描失败 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${{ github.repository }}" --comment "最近一轮扫描成功，本工单自动关闭。"
          fi

      - name: Prune old workflow runs
        # Sweeps every completed run except this one, so the Actions page
        # stays at a single entry between scans. Deletion is permanent and
        # idempotent; the index can lag behind the 204s.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=${{ github.run_id }}
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --paginate \
            --jq '.workflow_runs[] | select(.id != '"$KEEP"') | select(.status == "completed") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" > /dev/null 2>&1 || true
            done

      - name: Report failure as issue
        # Placed last and gated on failure(), so any failed step above files a
        # durable ticket that survives the prune step's run cleanup.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "插件扫描失败 in:title" --json number --jq '.[0].number // empty')
          BODY="扫描在 $(date -u '+%Y-%m-%d %H:%M UTC') 失败。
          运行日志: ${RUN_URL}
          下一次定时扫描最迟 2 天后触发；成功后本工单自动关闭。"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "🔴 插件扫描失败（自动工单）" --body "$BODY"
          fi
