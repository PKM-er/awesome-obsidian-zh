name: Check New Chinese Plugins

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scan for new Chinese plugins
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/check_plugins.py

      - name: Create PR for high-confidence plugins
        if: steps.scan.outputs.high_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rows='${{ steps.scan.outputs.add_rows }}'
          branch="auto/new-plugins-$(date +%Y%m%d)"
          git checkout -b "$branch"

          echo "$rows" | python3 -c "
import json, sys, re
rows = json.loads(sys.stdin.read())

with open('README.md', 'r', encoding='utf-8') as f:
    text = f.read()

# Insert rows before the ### 社区汉化指引 section (after 其他工具 table)
anchor = '## 精选中文主题'
insert_pos = text.rfind('| [Password Protection](https://github.com/qing3962/password-protection)')
if insert_pos == -1:
    anchor_pos = text.find(anchor)
    insert_pos = text.rfind('|', 0, anchor_pos)

# Find end of line after insert_pos
eol = text.find('\n', insert_pos)
line_end = text.find('\n', eol + 1) if text[eol+1:eol+2] != '\n' else eol

# Generate rows sorted by author
rows_sorted = sorted(rows, key=lambda r: r['author'].lower())
new_rows = ''
for r in rows_sorted:
    new_rows += f'| [{r[\"name\"]}](https://github.com/{r[\"repo\"]}) | \`{r[\"author\"]}\` | {r[\"desc\"]} |\n'

text = text[:line_end+1] + new_rows + text[line_end+1:]

with open('README.md', 'w', encoding='utf-8') as f:
    f.write(text)
"

          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-add new Chinese-relevant plugins [skip ci]"

          # Build PR body
          body="## New Chinese-Relevant Plugins Detected\n\n"
          body+="The following plugins match the native-Chinese or Chinese-translation criteria:\n\n"
          body+="| Plugin | Author | Description |\n"
          body+="| --- | --- | --- |\n"
          echo "$rows" | python3 -c "
import json, sys
rows = json.loads(sys.stdin.read())
for r in sorted(rows, key=lambda x: x['author'].lower()):
    print(f'| [{r[\"name\"]}](https://github.com/{r[\"repo\"]}) | \`{r[\"author\"]}\` | {r[\"desc\"]} |')
" >> body_rows.txt
          body+=$(cat body_rows.txt)
          body+="\n\n_This PR was automatically generated by the weekly plugin scan._"

          git push origin "$branch"
          gh pr create \
            --title "Add new Chinese-relevant plugins ($(date +%Y-%m-%d))" \
            --body "$body" \
            --head "$branch"

      - name: Create issue for review candidates
        if: steps.scan.outputs.medium_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          medium='${{ steps.scan.outputs.medium_candidates }}'
          body="## Plugins Requiring Manual Review\n\n"
          body+="These plugins may match the native-Chinese criteria but need human review:\n\n"
          body+="| Plugin | Author | Description | Score |\n"
          body+="| --- | --- | --- | --- |\n"
          echo "$medium" | python3 -c "
import json, sys
items = json.loads(sys.stdin.read())
for c in sorted(items, key=lambda x: -x['score']):
    print(f'| [{c[\"name\"]}](https://github.com/{c[\"repo\"]}) | \`{c[\"author\"]}\` | {c[\"desc\"]} | {c[\"score\"]} |')
" >> body_rows.txt
          body+=$(cat body_rows.txt)
          body+="\n\n_This issue was automatically generated by the weekly plugin scan._"

          gh issue create \
            --title "Review: new Chinese plugin candidates ($(date +%Y-%m-%d))" \
            --body "$body" \
            --label "review"
