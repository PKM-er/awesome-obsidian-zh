name: Tests

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests zhconv

      - name: Run unit tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Syntax check
        run: python -m py_compile .github/scripts/check_plugins.py
